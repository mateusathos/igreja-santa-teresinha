<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paróquia Santa Teresinha - Celebrações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <script src="programacoes.js" defer></script>
    <link rel="icon" href="imgs/logo-2.png" type="image/png" sizes="32x32">
</head>
<body class="bg-gradient-to-br from-white via-red-50/20 to-white">
    <div id="header"></div>
    <main class="mx-auto min-h-[70vh] max-w-5xl px-4 pb-16 pt-28 sm:px-6">
        <div class="fade-in text-center">
            <h1 class="page-title text-3xl font-bold tracking-wide text-red-900 xl:text-4xl">Celebrações e atividades</h1>
            <p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-stone-600 sm:text-base">Programação das comunidades da Paróquia Santa Teresinha.</p>
        </div>
        <div id="programacoes-loading" class="mt-10 rounded-lg border border-red-950/10 bg-white px-5 py-8 text-center text-sm font-semibold text-stone-600 shadow-sm">Carregando programação...</div>
        <div id="programacoes-error" class="mt-10 hidden rounded-lg border border-red-200 bg-red-50 px-5 py-4 text-center text-sm font-semibold text-red-900"></div>
        <div id="programacoes-list" class="mt-10 grid gap-6 lg:grid-cols-2"></div>
    </main>
    <div id="footer"></div>
</body>
</html>
